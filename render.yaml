services:
  - type: web
    name: lextitle-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DOCFILLER_DB_PATH
        value: /app/data/docfiller.db
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: admin@lextitle.ai
      - key: ADMIN_PASSWORD
        generateValue: true
