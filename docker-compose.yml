version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./storage/docauto.db
      - STORAGE_DIR=/app/storage
      - AI_PROVIDER=huggingface
      - HUGGINGFACE_MODEL=Qwen/Qwen2.5-72B-Instruct
    volumes:
      - ./storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
